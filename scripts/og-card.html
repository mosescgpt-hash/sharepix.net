<!doctype html>
<!--
  Source for public/og-card.jpg — the 1200×630 image every link preview shows.

  Not built by `npm run build`. It changes when the brand changes, which is
  roughly never, and wiring it into the build would make Playwright and a
  Chromium download a dependency of every deploy for an asset that is already
  committed. To regenerate after editing this file:

    1. Inline the photo, because a file:// page cannot read ../public:
         node -e "const fs=require('fs');const b=fs.readFileSync('public/site/slots/home-hero.webp').toString('base64');fs.writeFileSync('/tmp/og.html',fs.readFileSync('scripts/og-card.html','utf8').replace('PHOTO','data:image/webp;base64,'+b))"
    2. Screenshot it at 1200×630 with Playwright (or any headless browser),
         type: 'jpeg', quality: 90, and wait on document.fonts.ready first —
         the two brand faces come from Google Fonts and a screenshot taken
         before they load renders the whole card in Times.
    3. Save over public/og-card.jpg and commit it.

  The layout is deliberately safe against cropping: every platform crops this
  aspect differently, and nothing that matters sits within 56px of an edge.
-->
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;800&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    display: flex;
    font-family: 'Poppins', system-ui, sans-serif;
    background: #123851;
    color: #FAF8F4;
    overflow: hidden;
  }
  .left {
    width: 660px;
    padding: 72px 56px 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .wordmark { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
  .wordmark .pix { color: #7AD8C0; }
  .wordmark .tld { color: rgba(250,248,244,0.42); }
  h1 { margin-top: 40px; line-height: 1.04; letter-spacing: -0.025em; }
  h1 .one { display: block; font-size: 66px; font-weight: 800; }
  h1 .two {
    display: block;
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 66px;
    color: #7AD8C0;
    letter-spacing: -0.01em;
  }
  p.sub {
    margin-top: 34px;
    font-size: 25px;
    line-height: 1.45;
    color: rgba(250,248,244,0.78);
    max-width: 500px;
  }
  .right { position: relative; width: 540px; }
  .right img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Feathers the photo into the navy so there is no hard seam down the middle. */
  .fade {
    position: absolute; inset: 0;
    background: linear-gradient(to right, #123851 0%, rgba(18,56,81,0.55) 22%, rgba(18,56,81,0) 55%);
  }
</style>
<div class="left">
  <div class="wordmark">share<span class="pix">pix</span><span class="tld">.net</span></div>
  <h1>
    <span class="one">Every moment.</span>
    <span class="two">Everyone&rsquo;s perspective.</span>
  </h1>
  <p class="sub">One QR code on the table. Every guest&rsquo;s camera. All the photos in one gallery.</p>
</div>
<div class="right">
  <img src="PHOTO">
  <div class="fade"></div>
</div>
